name: Generate Kindle Dashboard
on:
  schedule:
    - cron: '0 * * * *' # jede Stunde. Kürzere Abstände (z. B. '*/15 * * * *') gehen, dann im Editor beim Textfenster den PNG-Update-Takt anpassen
  workflow_dispatch:     # manuell per Klick startbar
  push:                  # neu rendern, wenn der Editor die Profile hochlädt
    branches-ignore: [gh-pages]
    paths: [profiles.json, layout.json, index.html, screenshot.js, weather.js, verses.js, editor.html, package.json]

concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren (Puppeteer + sharp)
        run: npm install

      - name: PNGs für alle Geräte erzeugen (Ordner public/)
        run: node screenshot.js

      - name: Editor mitveröffentlichen
        run: cp editor.html public/

      - name: Auf GitHub Pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
