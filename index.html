<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    /* 1. Grundfläche exakt auf Kindle-Größe festlegen */
    html, body {
      margin: 0;
      padding: 0;
      width: 758px;
      height: 1024px;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }

    /* 2. Zentrierter Wrapper: Nutzt 1024x758 Platz und dreht ihn um 90 Grad */
    .dashboard-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1024px;
      height: 758px;
      transform: translate(-50%, -50%) rotate(90deg);
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Deinen bestehenden Dashboard-Inhalt hier in den Wrapper legen -->
  <div class="dashboard-wrapper">
    <!-- HIER DEIN DASHBOARD-HTML (Kalender, Wetter, etc.) -->
  </div>

</body>
</html>
