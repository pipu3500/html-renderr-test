<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kindle Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1024px;
      height: 758px;
      overflow: hidden;
      background: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    body { position: relative; }

    /* Jedes Fenster wird per layout.json absolut positioniert */
    .box {
      position: absolute;
      border: 4px solid #000;
      background: #fff;
      overflow: hidden;
    }

    .weather {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px;
    }
    .weather h2 { flex: none; font-size: 26px; margin-bottom: 6px; }
    .weather img {
      flex: 1;
      min-height: 0;
      width: 100%;
      object-fit: contain;
      /* wttr.in liefert hell auf dunkel -> für E-Ink invertieren */
      filter: invert(100%) grayscale(100%);
    }

    .box iframe { width: 100%; height: 100%; border: none; filter: grayscale(100%); }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
      filter: grayscale(100%);
    }
  </style>
</head>
<body>
<script>
  // Standardlayout, falls keine layout.json übergeben wird (Werte in Querformat-Pixeln, 1024x758)
  var DEFAULTS = {
    weather:  { enabled: true, x: 15,  y: 15,  w: 489, h: 728 },
    calendar: { enabled: true, x: 519, y: 15,  w: 490, h: 475 },
    agenda:   { enabled: true, x: 519, y: 505, w: 238, h: 238 },
    photo:    { enabled: true, x: 771, y: 505, w: 238, h: 238 }
  };

  var CAL = 'family13776384795444561092%40group.calendar.google.com';
  var CAL_BASE = 'https://calendar.google.com/calendar/embed?src=' + CAL +
    '&ctz=Europe%2FBerlin&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=0';

  var CONTENT = {
    weather:  { cls: 'weather', html: '<h2>Wetter Sundern</h2><img src="https://wttr.in/Sundern.png?lang=de" alt="Wetter">' },
    calendar: { cls: 'cal-month', html: '<iframe src="' + CAL_BASE + '&mode=MONTH" scrolling="no"></iframe>' },
    agenda:   { cls: 'cal-next', html: '<iframe src="' + CAL_BASE + '&mode=AGENDA&showDate=0" scrolling="no"></iframe>' },
    photo:    { cls: 'photo', html: '<img src="https://lh3.googleusercontent.com/d/1WVXOZY6CS56w8VjM-qV2itM60bWrqALy" alt="Kindle Foto">' }
  };

  function num(v, fallback) {
    v = Number(v);
    return isFinite(v) ? Math.round(v) : fallback;
  }

  var given = (window.LAYOUT && window.LAYOUT.widgets) || {};

  Object.keys(CONTENT).forEach(function (id) {
    var d = DEFAULTS[id];
    var s = given[id] || {};
    var enabled = typeof s.enabled === 'boolean' ? s.enabled : d.enabled;
    if (!enabled) return;

    var el = document.createElement('div');
    el.className = 'box ' + CONTENT[id].cls;
    el.style.left   = num(s.x, d.x) + 'px';
    el.style.top    = num(s.y, d.y) + 'px';
    el.style.width  = Math.max(40, num(s.w, d.w)) + 'px';
    el.style.height = Math.max(40, num(s.h, d.h)) + 'px';
    el.innerHTML = CONTENT[id].html;
    document.body.appendChild(el);
  });
</script>
</body>
</html>
