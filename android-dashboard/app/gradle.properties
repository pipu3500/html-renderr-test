org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9 bringt eine eingebaute Kotlin-Unterstuetzung mit, die standardmaessig an ist und mit dem
# zusaetzlich eingebundenen org.jetbrains.kotlin.android-Plugin kollidiert ("Cannot add extension
# with name 'kotlin', as there is an extension already registered with that name."). Deaktiviert,
# damit das klassische Kotlin-Plugin wie gewohnt funktioniert.
android.builtInKotlin=false
