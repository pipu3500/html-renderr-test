<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kindle Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1024px;
      height: 758px;
      overflow: hidden;
      background: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }
    body { position: relative; }

    /* Jedes Fenster wird per layout.json absolut positioniert */
    .box {
      position: absolute;
      border: 4px solid #000;
      background: #fff;
      overflow: hidden;
    }

    /* Der Inhalt liegt in .rot und wird mittig gedreht (0, 90, 180, 270 Grad).
       Größe und Drehung setzt das Skript unten. */
    .rot { position: absolute; left: 50%; top: 50%; overflow: hidden; }

    .weather {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px;
    }
    .weather h2 { flex: none; font-size: 26px; margin-bottom: 6px; }
    .weather img {
      flex: 1;
      min-height: 0;
      width: 100%;
      object-fit: contain;
      /* wttr.in liefert hell auf dunkel -> für E-Ink invertieren */
      filter: invert(100%) grayscale(100%);
    }

    .rot iframe { width: 100%; height: 100%; border: none; filter: grayscale(100%); }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
      filter: grayscale(100%);
    }
  </style>
</head>
<body>
<script>
  // Standardlayout, falls keine layout.json übergeben wird (Querformat-Pixel, 1024x758)
  var DEFAULTS = {
    weather:  { enabled: true, x: 15,  y: 15,  w: 489, h: 728, rotate: 0, location: 'Sundern' },
    calendar: { enabled: true, x: 519, y: 15,  w: 490, h: 475, rotate: 0,
                calendarId: 'family13776384795444561092@group.calendar.google.com' },
    agenda:   { enabled: true, x: 519, y: 505, w: 238, h: 238, rotate: 0, calendarId: '' },  // leer = wie Kalender
    photo:    { enabled: true, x: 771, y: 505, w: 238, h: 238, rotate: 0,
                fileId: '1WVXOZY6CS56w8VjM-qV2itM60bWrqALy' }
  };
  var BORDER = 4;

  var given = (window.LAYOUT && window.LAYOUT.widgets) || {};

  function num(v, fallback) {
    v = Number(v);
    return isFinite(v) ? Math.round(v) : fallback;
  }
  function text(v, fallback) {
    v = typeof v === 'string' ? v.replace(/[\u0000-\u001f]/g, '').trim().slice(0, 300) : '';
    return v || fallback;
  }
  // Kalender-ID: auch ein eingefügter Einbettungs-Link (…?src=ID) oder %40 statt @ ist okay
  function calendarId(v) {
    v = text(v, '');
    var m = v.match(/[?&]src=([^&]+)/);
    if (m) v = m[1];
    try { v = decodeURIComponent(v); } catch (e) { /* unverändert lassen */ }
    return v.trim();
  }
  // Drive-ID: auch ein Freigabe-Link (…/d/ID/… oder …?id=ID) ist okay
  function driveId(v) {
    v = text(v, '');
    var m = v.match(/\/d\/([\w-]+)/) || v.match(/[?&]id=([\w-]+)/);
    return m ? m[1] : v;
  }
  function calendarSrc(id, mode) {
    return 'https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(id) +
      '&ctz=Europe%2FBerlin&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=0' +
      '&mode=' + mode + (mode === 'AGENDA' ? '&showDate=0' : '');
  }
  function make(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  var mainCalendar = calendarId((given.calendar || {}).calendarId) || calendarId(DEFAULTS.calendar.calendarId);

  var BUILD = {
    weather: function (root, s) {
      var place = text(s.location, DEFAULTS.weather.location);
      root.className += ' weather';
      var h = make('h2'); h.textContent = 'Wetter ' + place;
      var img = make('img', { src: 'https://wttr.in/' + encodeURIComponent(place) + '.png?lang=de', alt: 'Wetter' });
      root.appendChild(h); root.appendChild(img);
    },
    calendar: function (root, s) {
      root.appendChild(make('iframe', { src: calendarSrc(mainCalendar, 'MONTH'), scrolling: 'no' }));
    },
    agenda: function (root, s) {
      var id = calendarId(s.calendarId) || mainCalendar;
      root.appendChild(make('iframe', { src: calendarSrc(id, 'AGENDA'), scrolling: 'no' }));
    },
    photo: function (root, s) {
      root.className += ' photo';
      var id = driveId(s.fileId) || DEFAULTS.photo.fileId;
      root.appendChild(make('img', { src: 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id), alt: 'Foto' }));
    }
  };

  Object.keys(BUILD).forEach(function (id) {
    var d = DEFAULTS[id];
    var s = given[id] || {};
    var enabled = typeof s.enabled === 'boolean' ? s.enabled : d.enabled;
    if (!enabled) return;

    var w = Math.max(40, num(s.w, d.w));
    var h = Math.max(40, num(s.h, d.h));
    var r = [0, 90, 180, 270].indexOf(Number(s.rotate)) >= 0 ? Number(s.rotate) : 0;

    var box = make('div', { 'class': 'box' });
    box.style.left = num(s.x, d.x) + 'px';
    box.style.top = num(s.y, d.y) + 'px';
    box.style.width = w + 'px';
    box.style.height = h + 'px';

    // Nutzfläche innerhalb des Rahmens; bei 90/270 Grad Breite und Höhe tauschen
    var iw = w - 2 * BORDER, ih = h - 2 * BORDER;
    var swap = r === 90 || r === 270;
    var rot = make('div', { 'class': 'rot' });
    rot.style.width = (swap ? ih : iw) + 'px';
    rot.style.height = (swap ? iw : ih) + 'px';
    rot.style.transform = 'translate(-50%, -50%) rotate(' + r + 'deg)';

    BUILD[id](rot, s);
    box.appendChild(rot);
    document.body.appendChild(box);
  });
</script>
</body>
</html>
