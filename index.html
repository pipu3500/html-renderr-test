<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kindle Dashboard</title>
  <style>
    /* Reset & Canvas-Anpassung für Kindle PW2 (758x1024 Hochformat-Ausgabe) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 758px;
      height: 1024px;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }

    /* 90-Grad Rotation Wrapper: Nutzt 1024x758 Querformat auf der 758x1024 Fläche */
    .dashboard-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1024px;
      height: 758px;
      transform: translate(-50%, -50%) rotate(90deg);
      padding: 15px;
      box-sizing: border-box;
      background: white;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 2fr 1fr;
      gap: 15px;
    }

    /* Dein originales Layout-Styling */
    .box { 
      border: 4px solid black; 
      padding: 10px; 
      overflow: hidden; 
      background: white; 
    }
    
    .weather { 
      grid-column: 1 / 2; 
      grid-row: 1 / 3; 
    }
    
    .cal-month { 
      grid-column: 2 / 3; 
      grid-row: 1 / 2; 
      padding: 0; 
    }
    
    .bottom-right { 
      grid-column: 2 / 3; 
      grid-row: 2 / 3; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 15px; 
    }
    
    .cal-next, .photo { 
      border: 4px solid black; 
      padding: 0; 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    
    /* Graustufen-Filter für E-Ink Optimierung */
    iframe, img { 
      filter: grayscale(100%); 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
    
    .photo img { 
      object-fit: contain; 
      padding: 5px; 
      box-sizing: border-box; 
    }
  </style>
</head>
<body>

  <div class="dashboard-wrapper">

    <!-- Linke Box: Wetter für Sundern -->
    <div class="box weather" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
      <h2>Wetter Sundern</h2>
      <!-- invert(100%) kehrt Schwarz und Weiß um, grayscale(100%) entfernt Farbstiche -->
      <img src="https://wttr.in/Sundern.png?lang=de" alt="Wetter" style="width: 100%; height: 85%; object-fit: contain; filter: invert(100%) grayscale(100%);">
    </div>

    <!-- Oben Rechts: Google Kalender Monatsübersicht -->
    <div class="box cal-month">
      <iframe src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&mode=MONTH&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0" scrolling="no"></iframe>
    </div>

    <div class="bottom-right">
      <!-- Unten Mitte: Google Kalender Nächster Termin (Agenda-Ansicht) -->
      <div class="cal-next">
        <iframe src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=0&showDate=0" scrolling="no"></iframe>
      </div>
      
      <!-- Unten Rechts: Google Photos / QR Code -->
      <div class="photo">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=Test-Dashboard-Erfolgreich" alt="QR Code">
      </div>
    </div>

  </div>

</body>
</html>
