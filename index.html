<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kindle Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1024px;
      height: 758px;
      overflow: hidden;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
    }

    body {
      padding: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 2fr 1fr;
      gap: 15px;
    }

    /* Grid-Layout */
    .box { 
      border: 4px solid black; 
      padding: 10px; 
      overflow: hidden; 
      background: white; 
    }

    .weather { 
      grid-column: 1 / 2; 
      grid-row: 1 / 3; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .cal-month { 
      grid-column: 2 / 3; 
      grid-row: 1 / 2; 
      padding: 0; 
    }

    .bottom-right { 
      grid-column: 2 / 3; 
      grid-row: 2 / 3; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 15px; 
    }

    .cal-next, .photo { 
      border: 4px solid black; 
      padding: 0; 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    
    /* Graustufen-Filter für E-Ink */
    iframe, img { 
      filter: grayscale(100%); 
      width: 100%; 
      height: 100%; 
      border: none; 
    }

    .photo img { 
      object-fit: contain; 
      padding: 5px; 
    }
  </style>
</head>
<body>

  <!-- Linke Box: Wetter für Sundern -->
  <div class="box weather">
    <h2>Wetter Sundern</h2>
    <img src="https://wttr.in/Sundern.png?lang=de" alt="Wetter" style="width: 100%; height: 85%; object-fit: contain; filter: invert(100%) grayscale(100%);">
  </div>

  <!-- Oben Rechts: Google Kalender Monatsübersicht -->
  <div class="box cal-month">
    <iframe src="https://calendar.google.com/calendar/embed?src=family13776384795444561092%40group.calendar.google.com&ctz=Europe%2FBerlin&mode=MONTH&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=0" scrolling="no"></iframe>
  </div>

  <div class="bottom-right">
    <!-- Unten Mitte: Google Kalender Nächster Termin -->
    <div class="cal-next">
      <iframe src="https://calendar.google.com/calendar/embed?src=family13776384795444561092%40group.calendar.google.com&ctz=Europe%2FBerlin&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=0&showDate=0" scrolling="no"></iframe>
    </div>
    
    <!-- Unten Rechts: Google Photo -->
    <div class="photo">
      <img src="https://lh3.googleusercontent.com/d/1WVXOZY6CS56w8VjM-qV2itM60bWrqALy" alt="Kindle Foto">
    </div>
  </div>

</body>
</html>
