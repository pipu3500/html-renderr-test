name: Build Android Dashboard APK

# Eigenständig vom Kindle-Dashboard: reagiert nur auf Änderungen unter android-dashboard/app/
# und teilt sich keine Schritte, Geheimnisse oder Logik mit .github/workflows/render.yml.
on:
  push:
    paths: [android-dashboard/app/**, .github/workflows/android-apk.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-dashboard/app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: APK bauen (Debug-Signatur, zum Installieren auf eigenen Geräten)
        run: gradle :app:assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: android-dashboard-apk
          path: android-dashboard/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK in Release "android-latest" veröffentlichen (stabiler Download-Link fürs Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android-Dashboard (letzter Build)
          body: Automatisch erzeugt. Diese Datei direkt im Browser des Android-Geräts öffnen und die Installation bestätigen (einmalig "Installation aus unbekannten Quellen" erlauben).
          files: android-dashboard/app/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
